name: Refresh Z47'47 feed

# Index: NSE-session snapshots. Companies: after NSE and US close + manual run.
# The z47-index-data Cloudflare Worker dispatches this on time (GitHub's own schedule starts hours late):
# scope "index" every 15 min in market hours, "all" 45 min after the EverythingDesign feed's after-close runs.
# GitHub's own schedule is off in this copy while the EverythingDesign feed still runs: a late scheduled run
# could call Screener at the same time as that feed, and Screener refuses overlapping runs (HTTP 429).
# Put the crons back ("30 4-9", "45 10", "15 22" on weekdays) when the EverythingDesign feed is retired.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: "all = index and company pages; index = index only, without Screener (market hours)"
        type: choice
        options: [all, index]
        default: all

permissions:
  contents: write

concurrency:
  group: z47-feed-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  refresh-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: python3 -m pip install --quiet --upgrade yfinance
      - name: Build index feed
        env:
          SCREENER_SESSIONID: ${{ secrets.SCREENER_SESSIONID }}
        # Market-hours runs skip Screener, which refuses frequent calls (see carried_table_live).
        run: python3 build_z47_json.py --write-history ${{ (inputs.scope == 'index' || github.event.schedule == '30 4-9 * * 1-5') && '--light' || '' }}
      - name: Commit index if changed
        run: |
          git config user.name  "z47-feed-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add z47_index.json z47_history.csv monthly-takeaways.json data/rebalances/cap-ledger.json
          if git diff --staged --quiet; then
            echo "No index changes."
          else
            git commit -m "data: refresh Z47 index ($(date -u +'%Y-%m-%dT%H:%MZ'))"
            git pull --rebase origin "${{ github.ref_name }}"
            git push
          fi

  refresh-companies:
    # After the index job: both use the same Screener login, and Screener refuses (HTTP 429) when they overlap.
    needs: refresh-index
    if: always() && ((github.event_name == 'workflow_dispatch' && inputs.scope != 'index') || github.event.schedule == '45 10 * * 1-5' || github.event.schedule == '15 22 * * 1-5')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: python3 -m pip install --quiet --upgrade yfinance
      - name: Build all company pages (Screener + Yahoo)
        env:
          SCREENER_SESSIONID: ${{ secrets.SCREENER_SESSIONID }}
        run: python3 scripts/build_company_hero.py --sleep 2
      - name: Refresh chart history (retain cached data on provider failure)
        id: charts
        continue-on-error: true
        env:
          SCREENER_SESSIONID: ${{ secrets.SCREENER_SESSIONID }}
        run: python3 scripts/build_company_chart.py --sleep 3
      - name: Commit companies if changed
        run: |
          git config user.name  "z47-feed-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/companies/
          if git diff --staged --quiet; then
            echo "No company JSON changes."
          else
            git commit -m "data: refresh all company pages from Screener ($(date -u +'%Y-%m-%dT%H:%MZ'))"
            git pull --rebase origin "${{ github.ref_name }}"
            git push
          fi
      - name: Report incomplete chart refresh
        if: steps.charts.outcome == 'failure'
        run: |
          echo "Some charts could not refresh. Check logs and data_as_of; cached history was retained."
          exit 1
